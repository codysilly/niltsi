
name: Update METAR Data

on:
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: niltsi-metar-update
  cancel-in-progress: false

jobs:
  update-metar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Retrieve METAR observations
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          url = (
              "https://aviationweather.gov/api/data/metar"
              "?ids=KORD,KLAX,KJFK&format=json"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "NiltsiDashboard/0.5 (GitHub Actions)",
                  "Accept": "application/json"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              observations = json.load(response)

          if not isinstance(observations, list) or not observations:
              raise ValueError("No METAR observations returned")

          stations = {item.get("icaoId") for item in observations}
          required = {"KORD", "KLAX", "KJFK"}
          if not required.issubset(stations):
              raise ValueError(f"Missing stations: {required - stations}")

          payload = {
              "updated_utc": datetime.now(timezone.utc).isoformat(),
              "source": url,
              "metars": observations
          }

          Path("data/metars.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8"
          )

          print("Saved METAR data for:", ", ".join(sorted(stations)))
          PY

      - name: Commit updated METAR data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metars.json
          if ! git diff --cached --quiet; then
            git commit -m "Update METAR observations"
            git push
          fi
