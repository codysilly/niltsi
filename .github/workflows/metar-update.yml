name: Update METAR Data
on:
  workflow_dispatch:
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: niltsi-metar-update
  cancel-in-progress: false
jobs:
  update-metar:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    outputs:
      published: ${{ steps.publish.outputs.published }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve METAR observations with retries
        run: python scripts/update_metar.py
      - name: Publish validated data with bounded conflict retries
        id: publish
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/publish_data.sh data/metars.json
  deploy:
    needs: update-metar
    if: needs.update-metar.outputs.published == 'true'
    uses: ./.github/workflows/pages-deploy.yml
