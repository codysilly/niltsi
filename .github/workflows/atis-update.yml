name: Update ATIS Data
on:
  workflow_dispatch:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: niltsi-atis-update
  cancel-in-progress: false
jobs:
  update-atis:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    outputs:
      published: ${{ steps.publish.outputs.published }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve atis.info ATIS snapshots
        run: python scripts/update_atis.py
      - name: Publish validated data with bounded conflict retries
        id: publish
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/publish_data.sh data/atis.json
  deploy:
    needs: update-atis
    if: needs.update-atis.outputs.published == 'true'
    uses: ./.github/workflows/pages-deploy.yml
