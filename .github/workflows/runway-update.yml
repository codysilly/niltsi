name: Update FAA Runway Data
on:
  workflow_dispatch:
  schedule:
    - cron: '20 12 * * 4' # Weekly check; publish only validated FAA 28-day cycles
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: niltsi-runway-update
  cancel-in-progress: false
jobs:
  update-runways:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    outputs:
      published: ${{ steps.publish.outputs.published }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and validate FAA NASR runway ends
        run: python scripts/update_runways.py
      - name: Publish validated data with bounded conflict retries
        id: publish
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/publish_data.sh data/runways.json
  deploy:
    needs: update-runways
    if: needs.update-runways.outputs.published == 'true'
    uses: ./.github/workflows/pages-deploy.yml
