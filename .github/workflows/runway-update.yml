name: Update FAA Runway Data
on:
  workflow_dispatch:
  schedule:
    - cron: '20 12 * * 4' # Weekly check; publish only validated FAA 28-day cycles
permissions:
  contents: write
concurrency:
  group: niltsi-runway-update
  cancel-in-progress: false
jobs:
  update-runways:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and validate FAA NASR runway ends
        run: python scripts/update_runways.py
      - name: Commit runway data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runways.json
          if ! git diff --cached --quiet; then
            git commit -m "Update FAA NASR runway-end bearings"
            git push
          fi
